<body>
<div class="wrap"><div class="crumbs"><a href="index.html">весь гайд</a><i>→</i><a href="continent-africa.html">Африка</a><i>→</i>Танзания</div><div class="hero"><div class="country">Африка · 1 место</div><h1>Танзания</h1></div><div class="grid"><a class="card" href="kilimanjaro.html" data-region="africa" data-search="килиманджаро kilimanjaro танзания за неделю ходьбы проходишь путь от банановых плантаций до ледника на экваторе. верёвки и кошки не нужны, нужны дни на акклиматизацию и честный выбор маршрута. африка"><div class="ph"><img src="https://images.unsplash.com/photo-1489392191049-fc10c97e64b6?w=1600&amp;q=80&amp;fm=jpg&amp;fit=max" alt="" loading="lazy"></div><div class="body"><div class="country">Танзания</div><h3>Килиманджаро</h3><p class="lead">За неделю ходьбы проходишь путь от банановых плантаций до ледника на экваторе. Верёвки и кошки не нужны, нужны дни на акклиматизацию и честный выбор маршрута.</p></div></a></div><div class="crumbs"><a href="index.html">весь гайд</a><i>→</i><a href="continent-africa.html">Африка</a></div></div>
<div id="lb"><div><img alt=""><div class="cap"></div></div></div>
<script>
const lb=document.getElementById('lb');
if(lb){
  document.querySelectorAll('.gal img').forEach(img=>{
    img.addEventListener('click',()=>{
      lb.querySelector('img').src=img.dataset.full||img.src;
      lb.querySelector('.cap').textContent=img.alt||'';
      lb.classList.add('on');
    });
  });
  lb.addEventListener('click',()=>lb.classList.remove('on'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
}
</script>
</body>
