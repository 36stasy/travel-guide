<body>
<div class="wrap"><div class="crumbs"><a href="index.html">весь гайд</a><i>→</i><a href="continent-asia.html">Азия</a><i>→</i>Лаос</div><div class="hero"><div class="country">Азия · 1 место</div><h1>Лаос</h1></div><div class="grid"><a class="card" href="luang-prabang.html" data-region="asia_se" data-search="луангпрабанг и куангси luang prabang, kuang si лаос в двадцати девяти километрах от города из джунглей течёт вода цвета неоновой бирюзы, и она сама строит себе ступени из камня. а на рассвете по городу идут сотни монахов в оранжевом — и всё это без единого звука. юго-восточная азия"><div class="ph"><img src="https://images.unsplash.com/photo-1693039880389-62840065382c?w=1600&amp;q=80&amp;fm=jpg&amp;fit=max" alt="" loading="lazy"></div><div class="body"><div class="country">Лаос</div><h3>Луангпрабанг и Куангси</h3><p class="lead">В двадцати девяти километрах от города из джунглей течёт вода цвета неоновой бирюзы, и она сама строит себе ступени из камня. А на рассвете по городу идут сотни монахов в оранжевом — и всё это без единого звука.</p></div></a></div><div class="crumbs"><a href="index.html">весь гайд</a><i>→</i><a href="continent-asia.html">Азия</a></div></div>
<div id="lb"><div><img alt=""><div class="cap"></div></div></div>
<script>
const lb=document.getElementById('lb');
if(lb){
  document.querySelectorAll('.gal img').forEach(img=>{
    img.addEventListener('click',()=>{
      lb.querySelector('img').src=img.dataset.full||img.src;
      lb.querySelector('.cap').textContent=img.alt||'';
      lb.classList.add('on');
    });
  });
  lb.addEventListener('click',()=>lb.classList.remove('on'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
}
</script>
